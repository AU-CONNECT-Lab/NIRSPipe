# Pipeline step prose templates.
#
# [header] is the opening sentence of the Methods section.
# {ver} is replaced with the installed fnirs-pipe version.

[header]
plain    = "fNIRS data were processed using fnirs-pipe v{ver}."
markdown = "fNIRS data were processed using **fnirs-pipe** v{ver}."
latex    = "fNIRS data were processed using \\texttt{{fnirs-pipe}} v{ver}."

#
#
# Each section is one pipeline step. Keys:
#   plain     - sentence with {param} slots; {citations} expands to "(Author et al., Year)"
#   citations - list of BibTeX keys from references.bib
#
# A missing section means the step is omitted from the Methods (e.g. motion_none).
# {citations} is removed automatically when the citations list is empty.
# Slots holding a whole optional sentence ({manual}, {whiten}, {options}, ...) are filled in
# vocabulary.py and are empty when the run did not use that option.

[od_conversion]
plain = "Raw intensity signals were converted to optical density (OD) using MNE-Python {citations}."
citations = ["Gramfort2013"]

[sci_marking]
plain = "Channels were screened in non-overlapping {window_s} s windows: a window counted as coupled when its scalp coupling index (SCI) was at least {threshold} and its peak spectral power (PSP) at least {psp_threshold}, both measured {cardiac_band} {citations}. Channels coupled in fewer than {min_good_frac} of {scope} were marked as bad.{manual}"
citations = ["Pollonini2014"]

[motion_tddr]
plain = "Motion artifacts in the OD were corrected with temporal derivative distribution repair (TDDR) {citations}."
citations = ["Fishburn2019"]

[motion_wavelet]
plain = "Motion artifacts in the OD were corrected with wavelet filtering {citations}: each channel was decomposed with a stationary wavelet transform ({wavelet}), and detail coefficients more than {iqr_factor} interquartile ranges beyond the quartiles of their level were set to zero."
citations = ["Molavi2012"]

[beer_lambert]
plain = "Haemoglobin concentration changes (HbO, HbR) were computed from the OD with the modified Beer-Lambert law {citations}, using {dpf}."
citations = ["Delpy1988", "Cope1988"]

[bandpass]
plain = "Data were bandpass filtered ({l_freq}–{h_freq} Hz) using {filter}."
citations = ["Yucel2021"]

[highpass]
plain = "Data were high-pass filtered at {l_freq} Hz using {filter}."
citations = ["Yucel2021"]

[lowpass]
plain = "Data were low-pass filtered at {h_freq} Hz using {filter}."
citations = ["Yucel2021"]

[resample]
plain = "Data were resampled to {sfreq} Hz."
citations = ["Pinti2018"]

[confound_regression]
plain = "Nuisance signals were removed by regressing {regressors} out of each channel in a model with no task regressors, fitted with {noise_model}; all subsequent analysis used the residuals {citations}."
citations = ["Yucel2021"]

[glm]
plain = "A first-level general linear model (GLM) was fitted to each channel {citations}. Conditions were modelled {conditions}, the design also held {regressors}, and the model was fitted with {noise_model}. Channels marked as bad were fitted as well and flagged in the results."
citations = ["Santosa2018"]

[alff]
plain = "The amplitude of low-frequency fluctuations (ALFF) and its fractional form (fALFF) were computed for each channel over {l_freq}–{h_freq} Hz."
citations = []

[fc]
plain = "Functional connectivity was computed as the Pearson correlation between channels, separately for HbO and HbR."
citations = []

# A tree written before the regression recorded its conditions; it cannot say which model ran.
[regression_unrecorded]
plain = "A regression was applied whose design this derivatives tree does not record; re-run fnirs-pipe to describe it here."
citations = []

# ---- Hyperscanning ----
#
# These describe a dyad rather than a subject, and they follow the steps behind the member
# files the analysis read, so the paragraph reads as one pipeline. Their citations are
# placeholders (see references.bib); the prose is real.

[hyper_input]
plain = "The inter-brain measures were computed on the members' {stage} files, whose processing records could not be read, so their preprocessing is not described here."
citations = []

[hyper_alignment]
plain = "The recordings of each group were aligned on their first shared event marker and trimmed to a common length {citations}."
citations = ["TODO_HyperAlignment"]

[hyper_trim]
plain = "The recordings of each group were not aligned on an event marker; they were trimmed to a common length, assuming they started together."
citations = []

[hyper_wtc]
plain = "Inter-brain coupling was quantified with wavelet transform coherence (Morlet wavelet) between homologous retained long channels of each pair of members, separately for {chroma} {citations}.{whiten} Each coherence map was averaged over {band_fmin}–{band_fmax} Hz and over time{coi}, giving one value per channel pair.{conditions}{window}{bads}"
citations = ["TODO_Wavelet"]

[hyper_wtc_crossed]
plain = "Inter-brain coupling was quantified with wavelet transform coherence (Morlet wavelet) between every retained long channel of one member and every retained long channel of another, separately for {chroma} {citations}.{whiten} Each coherence map was averaged over {band_fmin}–{band_fmax} Hz and over time{coi}, giving one value per channel pair.{conditions}{window}{bads}"
citations = ["TODO_Wavelet"]

[hyper_coherence]
plain = "Inter-brain coupling was screened with the magnitude-squared coherence (Welch's method) between homologous retained long HbO channels, averaged over {coh_fmin}–{coh_fmax} Hz {citations}."
citations = ["TODO_Coherence"]

[hyper_isc]
plain = "Inter-subject correlation (ISC) was computed as the Pearson correlation between every retained long channel of one member and every retained long channel of another, separately for HbO and HbR {citations}.{options}"
citations = ["TODO_ISC"]

[hyper_phasenull]
plain = "A phase-randomised null was drawn {citations}: each channel of the second-listed member was replaced by a surrogate with the same amplitude spectrum and randomised Fourier phases, drawn independently per channel, and coherence was recomputed against the first member's unaltered recording over {pairs}, {n_iter} times{seed}. Each channel pair's null was summarised by the mean and the 95th percentile of its iterations."
citations = ["TODO_PhaseNull"]

[hyper_pairnull]
plain = "Coherence expected by chance was estimated with a re-paired null {citations}: the first-listed member was kept and their partner replaced, one at a time, by {pool} recorded on the same task, and {measures} recomputed for each such pairing over {pairs}. {count} Each condition was cut from each recording at that recording's own onset of the condition, with up to {pad} s of recording on either side, so every pairing spanned the same condition. Each channel pair's null was summarised by the mean and the 95th percentile of its stand-ins."
citations = ["TODO_RepairedNull"]

[hyper_roi]
plain = "Region-of-interest (ROI) values averaged the channel-pair values between each pair of regions, coherence directly and correlation in Fisher z; the homologous ROI coherence averaged only same-channel pairs.{min_channels}"
citations = []
