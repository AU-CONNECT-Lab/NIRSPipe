# Pipeline step prose templates.
#
# [header] is the opening sentence of the Methods section.
# {ver} is replaced with the installed fnirs-pipe version.

[header]
plain    = "fNIRS data were preprocessed using fnirs-pipe v{ver}."
markdown = "fNIRS data were preprocessed using **fnirs-pipe** v{ver}."
latex    = "fNIRS data were preprocessed using \\texttt{{fnirs-pipe}} v{ver}."

#
#
# Each section is one pipeline step. Keys:
#   plain     - sentence with {param} slots; {citations} expands to "(Author et al., Year)"
#   citations - list of BibTeX keys from references.bib
#
# A missing section means the step is omitted from the Methods (e.g. motion_none).
# {citations} is removed automatically when the citations list is empty.

[od_conversion]
plain = "Raw intensity signals were converted to optical density (OD) using MNE-Python {citations}."
citations = ["Gramfort2013"]

[sci_marking]
plain = "Channel signal quality was assessed using the scalp coupling index (SCI) and the peak spectral power (PSP) of the cardiac band {citations}. Channels with SCI below {threshold} or PSP below {psp_threshold} were {action}."
citations = ["Pollonini2014", "Pollonini2016"]

[motion_tddr]
plain = "Motion artifacts were corrected using temporal derivative distribution repair (TDDR) {citations}."
citations = ["Fishburn2019"]

[motion_wavelet]
plain = "Motion artifacts were suppressed using wavelet-based filtering."
citations = ["Molavi2012"]

[motion_spline]
plain = "Motion artifacts were suppressed using spline interpolation."
citations = ["Scholkmann2010"]

[beer_lambert]
plain = "Haemoglobin concentration changes (HbO, HbR) were estimated from OD using the modified Beer-Lambert law {citations} with a differential path length factor (DPF) of {dpf}."
citations = ["Delpy1988", "Cope1988"]

[bandpass]
plain = "Data were bandpass filtered ({l_freq}–{h_freq} Hz) using a zero-phase FIR filter (Hamming window)."
citations = ["Yucel2021"]

[highpass]
plain = "Data were high-pass filtered at {l_freq} Hz using a zero-phase FIR filter (Hamming window)."
citations = ["Yucel2021"]

[lowpass]
plain = "Data were low-pass filtered at {h_freq} Hz using a zero-phase FIR filter (Hamming window)."
citations = ["Yucel2021"]

[resample]
plain = "Data were resampled to {sfreq} Hz."
citations = ["Pinti2018"]

[confound_regression]
plain = "Systemic physiology was removed by regressing {regressors} out of the haemodynamic time series in an ordinary least-squares model containing no condition regressors; all subsequent analysis used the residuals {citations}."
citations = ["Yucel2021"]

[glm]
plain = "A first-level general linear model (GLM) was fitted to the haemodynamic time series using a {hrf_model} haemodynamic response function, a {noise_model} noise model, and a {drift_model} drift term (high-pass cutoff: {drift_high_pass} Hz) {citations}."
citations = ["Santosa2018"]
