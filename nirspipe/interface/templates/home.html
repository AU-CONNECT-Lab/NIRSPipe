{% extends "base.html" %}
{% block main %}
<h1>NIRSPipe</h1>
<p><a href="{{ url_for('commands.index') }}">Run a command</a></p>
<h2>Open pages</h2>
{% if links %}
<ul>
  {% for text, href in links %}
  <li><a href="{{ href }}">{{ text }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>Nothing is open yet.</p>
{% endif %}
{% endblock %}
