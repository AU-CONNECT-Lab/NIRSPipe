# Pipeline step prose templates.
#
# [header] is the opening sentence of the Methods section.
# {ver} is replaced with the installed nirspipe version.

[header]
plain    = "fNIRS data were processed using NIRSPipe v{ver}."
markdown = "fNIRS data were processed using **NIRSPipe** v{ver}."
latex    = "fNIRS data were processed using NIRSPipe v{ver}."

#
#
# Each section is one pipeline step. Keys:
#   plain     - sentence with {param} slots; {citations} expands to "(Author et al., Year)"
#   citations - list of BibTeX keys from references.bib
#
# A missing section means the step is omitted from the Methods (e.g. motion_none).
# {citations} is removed automatically when the citations list is empty.
# Slots holding a whole optional sentence ({manual}, {whiten}, {options}, ...) are filled in
# vocabulary.py and are empty when the run did not use that option.

[od_conversion]
plain = "Raw intensity signals were converted to optical density (OD) using MNE-Python {citations}."
citations = ["Gramfort2013"]

[sci_marking]
plain = "Channels were screened in non-overlapping {window_s} s windows: a window counted as coupled when its scalp coupling index (SCI) was at least {threshold} and its peak spectral power (PSP) at least {psp_threshold}, both measured {cardiac_band} {citations}. Channels coupled in fewer than {min_good_frac} of {scope} were marked as bad.{spans}{kept}{manual}{channels_tsv}"
citations = ["Pollonini2014"]

[excluded_unselected]
plain = "Only the stretches of each recording named in a table of kept time were analysed; the rest was marked BAD_unselected, kept as recorded through every filter and transform, and left out of channel screening and of every estimate."
citations = []

[excluded_manual]
plain = "Stretches the analyst marked as corrupted were listed in a table and marked BAD_manual: they were left out of channel screening and, like every corrupted span, of every estimate."
citations = []

[gvtd_censoring]
plain = "Head motion was flagged with the global variance of temporal derivatives (GVTD) {citations}, computed on the {channel_set} channels the screening kept and band-passed to {band}: frames above the mode of its histogram plus {n_std} times its spread below the mode were marked BAD_gvtd, as was every stretch left between them shorter than {min_epoch_s} s."
citations = ["Sherafati2020"]

[censor_fill]
plain = "Before filtering, every BAD_ span other than BAD_unselected was filled {method}, so that no filter ran across corrupted samples; the filled frames were still left out of every estimate."
citations = []

[motion_tddr]
plain = "Motion artifacts in the OD were corrected with temporal derivative distribution repair (TDDR) {citations}."
citations = ["Fishburn2019"]

[motion_wavelet]
plain = "Motion artifacts in the OD were corrected with wavelet filtering {citations}: each channel, zero-padded to 2^N samples, was decomposed into N minus {lowest_scale} levels with a shift-invariant discrete wavelet transform ({wavelet}), and at every level but the coarsest, detail coefficients more than {iqr_factor} interquartile ranges beyond the quartiles of their level and phase were set to zero."
citations = ["Molavi2012"]

[motion_tpca]
plain = "Motion artifacts in the OD were corrected with targeted principal component analysis {citations}: samples where any channel not marked bad changed within {t_motion} s by more than {std_thresh} standard deviations of its first difference, or by more than {amp_thresh} in OD, were marked as motion together with {t_mask} s either side, and the leading principal components of the marked samples across those channels, carrying less than {n_sv} of their variance between them, were removed. Detection and removal were repeated, removing the first pass's number of components each time, until no motion was marked or {max_iter} passes had run."
citations = ["Yucel2014"]

[motion_spline]
plain = "Motion artifacts in the OD were marked for each source-detector pair at samples where either wavelength changed within {t_motion} s by more than {std_thresh} standard deviations of its first difference, or by more than {amp_thresh} in OD, together with {t_mask} s either side, and corrected with spline interpolation {citations}: in each channel not marked bad, a cubic smoothing spline (smoothing parameter {p}, time in seconds) was fitted to each marked segment and subtracted, and every segment and every stretch between segments was shifted to continue from the one before it, matching means over {dt_short} s windows (the whole stretch when shorter, a tenth of it beyond {dt_long} s)."
citations = ["Scholkmann2010"]

[motion_spline_sg]
plain = "Motion artifacts in the OD were corrected with spline interpolation and Savitzky-Golay filtering as implemented by its authors {citations}. In each channel low-pass filtered at {lowpass} Hz, samples were marked where the gradient lay more than {grad_iqr} interquartile ranges beyond its quartiles, or where the standard deviation over {std_window} s windows, after a further {detect_lowpass} Hz low-pass, lay more than {std_iqr}; a marked stretch was corrected when it moved the signal more than the median {shift_lag} s change of the unmarked signal, or lasted over 0.1 s and under 0.5 s, or over 1 s. A wavelength whose unmarked stretches had a mean-to-standard-deviation ratio below {snr_min} took its partner's marks, and a pair below it on both was not spline-corrected. The signal, padded by {pad} s of its edge values, was corrected by cubic smoothing spline interpolation of the marked stretches (smoothing parameter {p}, time in seconds), and every channel was then smoothed with a Savitzky-Golay filter of order {sg_order} over {frame} s, which low-passes it with a -3 dB point near {sg_cutoff} Hz."
citations = []

[motion_wavelet_tddr]
plain = "Motion artifacts in the OD were corrected with wavelet filtering followed by temporal derivative distribution repair (TDDR) {citations}: each channel, zero-padded to 2^N samples, was decomposed into N minus {lowest_scale} levels with a shift-invariant discrete wavelet transform ({wavelet}); at every level but the coarsest, detail coefficients more than {iqr_factor} interquartile ranges beyond the quartiles of their level and phase were set to zero; and TDDR was applied to the reconstructed signal."
citations = []

[motion_spline_wavelet]
plain = "Motion artifacts in the OD were corrected with spline interpolation followed by wavelet filtering {citations}. Motion was marked for each source-detector pair at samples where either wavelength changed within {t_motion} s by more than {std_thresh} standard deviations of its first difference, or by more than {amp_thresh} in OD, together with {t_mask} s either side. In each channel not marked bad, a cubic smoothing spline (smoothing parameter {p}, time in seconds) was fitted to each marked segment and subtracted, and every segment and every stretch between segments was shifted to continue from the one before it, matching means over {dt_short} s windows (the whole stretch when shorter, a tenth of it beyond {dt_long} s). Each channel, zero-padded to 2^N samples, was then decomposed into N minus {lowest_scale} levels with a shift-invariant discrete wavelet transform ({wavelet}), and at every level but the coarsest, detail coefficients more than {iqr_factor} interquartile ranges beyond the quartiles of their level and phase were set to zero."
citations = []

[beer_lambert]
plain = "Haemoglobin concentration changes (HbO, HbR) were computed from the OD with the modified Beer-Lambert law {citations}, using {dpf}."
citations = ["Delpy1988", "Cope1988"]

[bandpass]
plain = "Data were bandpass filtered ({l_freq}–{h_freq} Hz) using {filter}."
citations = ["Yucel2021"]

[highpass]
plain = "Data were high-pass filtered at {l_freq} Hz using {filter}."
citations = ["Yucel2021"]

[lowpass]
plain = "Data were low-pass filtered at {h_freq} Hz using {filter}."
citations = ["Yucel2021"]

[resample]
plain = "Data were resampled to {sfreq} Hz."
citations = ["Pinti2018"]

[confound_regression]
plain = "Nuisance signals were removed by regressing {regressors} out of each channel in a model with no task regressors, fitted with {noise_model}; all subsequent analysis used the residuals {citations}.{censoring}"
citations = ["Yucel2021"]

[glm]
plain = "A first-level general linear model (GLM) was fitted to each channel {citations}. Conditions were modelled {conditions}, the design also held {regressors}, and the model was fitted with {noise_model}.{censoring} Channels marked as bad were fitted as well and flagged in the results."
citations = ["Santosa2018"]

[alff]
plain = "The amplitude of low-frequency fluctuations (ALFF) and its fractional form (fALFF) were computed for each channel over {l_freq}–{h_freq} Hz{kept}.{min_time}"
citations = []

[fc]
plain = "Functional connectivity was computed as the Pearson correlation between channels{kept}, separately for HbO and HbR.{min_time}"
citations = []

# A tree written before the regression recorded its conditions; it cannot say which model ran.
[regression_unrecorded]
plain = "A regression was applied whose design this derivatives tree does not record; re-run nirspipe to describe it here."
citations = []

# ---- Hyperscanning ----
#
# These describe a dyad rather than a subject, and they follow the steps behind the member
# files the analysis read, so the paragraph reads as one pipeline. Their citations are
# placeholders (see references.bib); the prose is real.

[hyper_input]
plain = "The inter-brain measures were computed on the members' {stage} files, whose processing records could not be read, so their preprocessing is not described here."
citations = []

[hyper_alignment]
plain = "The recordings of each group were aligned on their first shared event marker and trimmed to a common length {citations}."
citations = ["TODO_HyperAlignment"]

[hyper_trim]
plain = "The recordings of each group were not aligned on an event marker; they were trimmed to a common length, assuming they started together."
citations = []

[hyper_wtc]
plain = "Inter-brain coupling was quantified with wavelet transform coherence (Morlet wavelet) between homologous retained long channels of each pair of members, separately for {chroma} {citations}.{whiten} Each coherence map was averaged over {band_fmin}–{band_fmax} Hz and over time{coi}, giving one value per channel pair.{excluded}{conditions}{significance}{window}{bads}{device}"
citations = ["TODO_Wavelet"]

[hyper_wtc_crossed]
plain = "Inter-brain coupling was quantified with wavelet transform coherence (Morlet wavelet) between every retained long channel of one member and every retained long channel of another, separately for {chroma} {citations}.{whiten} Each coherence map was averaged over {band_fmin}–{band_fmax} Hz and over time{coi}, giving one value per channel pair.{excluded}{conditions}{significance}{window}{bads}{device}"
citations = ["TODO_Wavelet"]

[hyper_phasescale]
plain = "The relative phase was summarised by its circular mean over the band cells{coi}, restricted to cells above the per-frequency significance level where one had been drawn, for the band and for each frequency within it; at each frequency it was also expressed as a time lag, positive when the first member leads."
citations = []

[hyper_isc]
plain = "Inter-subject correlation (ISC) was computed as the Pearson correlation between homologous retained long channels of each pair of members, separately for {chroma} {citations}.{options}"
citations = ["TODO_ISC"]

[hyper_isc_crossed]
plain = "Inter-subject correlation (ISC) was computed as the Pearson correlation between every retained long channel of one member and every retained long channel of another, separately for {chroma} {citations}.{options}"
citations = ["TODO_ISC"]

[hyper_phasenull]
plain = "A phase-randomised null was drawn {citations}: each channel of the second-listed member was replaced by a surrogate with the same amplitude spectrum and randomised Fourier phases, drawn independently per channel, and coherence was recomputed against the first member's unaltered recording over {pairs}, {n_iter} times{seed}. Each channel pair's null was summarised by the mean and the 95th percentile of its iterations."
citations = ["TODO_PhaseNull"]

[hyper_pairnull]
plain = "Coherence expected by chance was estimated with a re-paired null {citations}: the first-listed member was kept and their partner replaced, one at a time, by {pool} recorded on the same task, and {measures} recomputed for each such pairing over {pairs}. {count} Each condition was cut from each recording at that recording's own onset of the condition, with up to {pad} s of recording on either side, so every pairing spanned the same condition. Each channel pair's null was summarised by the mean and the 95th percentile of its stand-ins.{regions}{device}"
citations = ["TODO_RepairedNull"]

# Written beside the cohort tables by nirspipe-hyper-groupnull, not into any report
[hyper_groupnull]
plain = "Cohort-level coupling was tested against the {null} null {citations}: {measure} was averaged over channel pairs within each occasion (one group on one task) and then over occasions. Each draw was compared with the real value over the channel pairs both kept, and that difference was subtracted from the real occasion mean, so a draw stands on the real dyad's channels. The result was compared with the null in two ways, a {tail} paired t test of each occasion's value against the mean of its own draws, and a permutation test ranking the cohort mean among {n_resample} cohort means each built from one randomly chosen draw per occasion{two_sided}.{correction}"
citations = ["TODO_GroupNull"]

[hyper_roi]
plain = "Region-of-interest (ROI) values averaged the channel-pair values between each pair of regions, coherence directly and correlation in Fisher z; the homologous ROI coherence averaged only same-channel pairs.{min_channels}"
citations = []
