name: install

# What a new user's pip resolves today: no constraints file, the newest releases, and an older pip
on:
  push:
    branches: [main]
  pull_request:
  # weekly, so an upstream release that breaks the install shows up without a push
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.os }} py${{ matrix.python }} pip ${{ matrix.pip }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        pip: [runner]
        include:
          # pip before 26 skips a pre-release-only requirement unless the specifier names one
          - os: ubuntu-latest
            python: "3.11"
            pip: "24.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Older pip
        if: matrix.pip != 'runner'
        run: python -m pip install "pip==${{ matrix.pip }}"
      - name: Libraries VTK loads on a Linux machine without a desktop
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1
      - name: Install without constraints
        run: |
          python -m pip --version
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip list
      - name: Every command answers --help
        run: |
          cmds=$(python -c "import tomllib; print(*tomllib.load(open('pyproject.toml', 'rb'))['project']['scripts'])")
          for cmd in $cmds; do
            "$cmd" --help > /dev/null || { echo "::error::$cmd --help failed"; exit 1; }
          done
      - uses: actions/cache@v4
        with:
          path: ~/mne_data
          key: mne-data-fsaverage-${{ runner.os }}-v1
      - name: fsaverage, which optode placement reads
        run: python -c "import mne; mne.datasets.fetch_fsaverage(verbose=True)"
      - name: Fast tests on synthetic data
        run: >-
          python -m pytest -q
          tests/io tests/test_import_layers.py tests/cli/test_cli.py
          tests/cli/test_bids_app_contract.py tests/provenance/test_sqm_record.py
