[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fnirs-pipe"
version = "0.13.0"
description = "BIDS-native fNIRS preprocessing, postprocessing, hyperscanning, QC, and run-tracking pipeline"
requires-python = ">=3.10"
dependencies = [
    "mne>=1.6",
    "mne-nirs>=0.7",      # 0.7 relocated scalp_coupling_index to mne.preprocessing.nirs
    "nilearn>=0.10",
    "scipy>=1.11",
    "numpy>=1.24",
    "pybids>=0.16",
    "mne-bids>=0.14",
    "h5py>=3.9",          # snirf (HDF5)
    "tables>=3.8",        # HDF5 backend for mne-nirs glm_est.save()
    "pandas>=2.0",
    "jinja2>=3.1",
    "plotly>=5.18",
    "kaleido",            # plotly static PNG export
    "joblib>=1.3",        # parallel dispatch (--n-jobs)
    "flask>=3.0",         # fnirs-rate viewer
    "dash>=2.16",
    "dash-bootstrap-components>=1.6",
    "dash-cytoscape>=1.0",   # GUI Analysis-page DAG
    "pycwt>=0.4",         # hyperscanning WTC (fnirs-qc hyper-post)
    "tomli>=2.0; python_version < '3.11'",
    "bibtexparser>=2.0.0b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
fnirs-pipe  = "fnirs_pipe.cli.run:main"
fnirs-prep  = "fnirs_pipe.cli.prep:main"
fnirs-recon = "fnirs_pipe.cli.recon:main"
fnirs-rate  = "fnirs_pipe.cli.rate:main"
fnirs-qc    = "fnirs_pipe.cli.qc:main"
fnirs-gui   = "fnirs_pipe.cli.gui:main"
fnirs-log   = "fnirs_pipe.cli.db:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fnirs_pipe*"]

[tool.setuptools.package-data]
fnirs_pipe = ["qc/boilerplate/*.toml", "qc/boilerplate/*.bib", "qc/templates/*.html", "qc/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
