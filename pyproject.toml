[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirspipe"
dynamic = ["version"]
description = "BIDS-native fNIRS preprocessing, postprocessing, hyperscanning, QC, and run-tracking pipeline"
authors = [
    { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
maintainers = [
    { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "mne>=1.6",
    "mne-nirs>=0.7",      # 0.7 relocated scalp_coupling_index to mne.preprocessing.nirs
    "nilearn>=0.10",
    "nibabel>=3.2",       # FreeSurfer curvature for the activation renders
    "scipy>=1.11",
    "numpy>=1.24",
    "pybids>=0.16",
    "mne-bids>=0.14",
    "h5py>=3.9",          # snirf (HDF5)
    "pandas>=2.0",
    "jinja2>=3.1",
    "plotly>=5.18",
    "pyvista>=0.43",      # off-screen 3D brain renders
    "matplotlib>=3.8",    # every static QC panel; imported at module level
    "pillow>=10.0",       # stitches the rendered brain views side by side
    "joblib>=1.3",        # parallel dispatch (--n-jobs)
    "flask>=3.0",         # nirspipe-rate viewer
    "dash[ag-grid]>=2.16",
    "dash-ag-grid>=33",     # Theming API; assets/interface.css styles it through --ag-*
    "dash-bootstrap-components>=1.6",
    "dash-cytoscape>=1.0",   # GUI Analysis-page DAG
    "pycwt>=0.4",         # hyperscanning WTC (nirspipe-qc hyper-post)
    "PyWavelets>=1.4",    # wavelet motion correction (--motion-correction wavelet)
    "tomli>=2.0; python_version < '3.11'",
    "bibtexparser>=2.0.0b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
nirspipe                 = "nirspipe.cli.run:main"
nirspipe-prep            = "nirspipe.cli.prep:main"
nirspipe-recon           = "nirspipe.cli.recon:main"
nirspipe-rate            = "nirspipe.cli.rate:main"
nirspipe-qc              = "nirspipe.cli.qc:main"
nirspipe-hyper           = "nirspipe.cli.hyper:main"
nirspipe-hyper-pairnull  = "nirspipe.cli.hyper:main_pair_null"
nirspipe-hyper-groupnull = "nirspipe.cli.hyper:main_group_null"
nirspipe-hyper-band      = "nirspipe.cli.hyper:main_band"
nirspipe-hyper-index     = "nirspipe.cli.hyper:main_index"
nirspipe-hyper-merge     = "nirspipe.cli.hyper:main_merge"
nirspipe-gui             = "nirspipe.cli.gui:main"
nirspipe-log             = "nirspipe.cli.db:main"

[tool.setuptools.dynamic]
version = {attr = "nirspipe.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["nirspipe*"]

[tool.setuptools.package-data]
nirspipe = ["data/*.json", "data/presets/*.toml", "qc/boilerplate/*.toml", "qc/boilerplate/*.bib", "qc/templates/*.html", "qc/templates/*.j2", "qc/templates/*.css", "interface/assets/*.css"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
