[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirspipe"
dynamic = ["version"]
description = "BIDS-native fNIRS preprocessing, postprocessing, hyperscanning and QC pipeline"
authors = [
    { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
maintainers = [
    { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "mne>=1.13",          # colin27_1005, as 1.14 drops the name standard_1005
    "mne-nirs>=0.7",      # 0.7 relocated scalp_coupling_index to mne.preprocessing.nirs
    "nilearn>=0.11",      # 0.10's AR fit fails under NumPy 2
    "nibabel>=5.2",       # FreeSurfer curvature for the activation renders
    "scipy>=1.14",
    "numpy>=2.1",
    "pybids>=0.20",       # parses the seg- entity
    "mne-bids>=0.14",
    "h5py>=3.11",         # snirf (HDF5)
    "pandas>=2.2.2",      # the first built against NumPy 2
    "jinja2>=3.1",
    "plotly>=5.19",       # bar marker cornerradius
    "pyvista>=0.44.2",    # off-screen 3D brain renders, the first to cap VTK below 9.4
    "matplotlib>=3.9",    # every static QC panel, imported at module level
    "pillow>=10.0",       # stitches the rendered brain views side by side
    "joblib>=1.3",        # parallel subjects (--nprocs)
    "threadpoolctl>=3.2", # BLAS threads per unit under --nprocs
    "flask>=3.0",         # nirspipe-gui and the nirspipe-rate viewers
    "pycwt>=0.5.0b0",     # hyperscanning WTC (nirspipe-hyper), b0 as PyPI has only pre-releases
    "PyWavelets>=1.6",    # wavelet motion correction (--motion-correction wavelet)
    "statsmodels>=0.14.2",# ar_irls's robust refit and groupnull's p corrections
    "bibtexparser>=2.0.0b9",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13",   # --device cuda; CUDA 12 builds run on newer drivers too
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
nirspipe                 = "nirspipe.cli.run:main"
nirspipe-prep            = "nirspipe.cli.prep:main"
nirspipe-snirf2bids      = "nirspipe.cli.snirf2bids:main"
nirspipe-rate            = "nirspipe.cli.rate:main"
nirspipe-qc              = "nirspipe.cli.qc:main"
nirspipe-provenance      = "nirspipe.cli.qc:main_provenance"
nirspipe-hyper           = "nirspipe.cli.hyper:main"
nirspipe-hyper-pairnull  = "nirspipe.cli.hyper:main_pair_null"
nirspipe-hyper-groupnull = "nirspipe.cli.hyper:main_group_null"
nirspipe-hyper-band      = "nirspipe.cli.hyper:main_band"
nirspipe-hyper-index     = "nirspipe.cli.hyper:main_index"
nirspipe-hyper-merge     = "nirspipe.cli.hyper:main_merge"
nirspipe-gui             = "nirspipe.cli.gui:main"

[tool.setuptools.dynamic]
version = {attr = "nirspipe.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["nirspipe*"]

[tool.setuptools.package-data]
nirspipe = ["data/*.json", "data/*.toml", "data/presets/*.toml", "qc/boilerplate/*.toml", "qc/boilerplate/*.bib", "qc/templates/*.html", "qc/templates/*.j2", "qc/templates/*.css", "interface/templates/*.html", "interface/static/*.css", "interface/static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
